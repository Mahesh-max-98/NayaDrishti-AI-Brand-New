name: Render uptime check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-uptime-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Render liveness
        env:
          HEALTH_URL: https://nayadrishti-ai-brand-new.onrender.com
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            "$HEALTH_URL/health")"
          printf '%s\n' "$response"
          python -c 'import json,sys; d=json.loads(sys.stdin.read()); assert d.get("status") == "ok", "Health endpoint did not return status=ok"' <<< "$response"

      - name: Check application and database readiness
        env:
          READY_URL: https://nayadrishti-ai-brand-new.onrender.com
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            "$READY_URL/ready")"
          printf '%s\n' "$response"
          python -c 'import json,sys; d=json.loads(sys.stdin.read()); assert d.get("status") == "ready", "Readiness endpoint did not return status=ready"' <<< "$response"
